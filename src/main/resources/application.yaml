spring:
  application:
    name: temporal-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  batch:
    job:
      enabled: false # Prevents Spring from running all Jobs automatically on startup
    jdbc:
      initialize-schema: always # Ensures tables are created if you move to a new DB

mybatis:
  mapper-locations: classpath:mappers/*.xml